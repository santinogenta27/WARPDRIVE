nombre: reembolso
objetivo: Iniciar el reembolso de un pedido entregado
datos_necesarios: [order_id, monto]
herramientas: [consultar_pedido, iniciar_reembolso]
condiciones:
  - Todo reembolso requiere aprobación humana; avisá que queda en revisión.
  - Si el pedido no fue entregado, explicá la política y ofrecé derivar.
cierre: Confirmá que el reembolso quedó registrado y el plazo de acreditación según la política.
