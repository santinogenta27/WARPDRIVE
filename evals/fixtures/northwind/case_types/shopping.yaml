nombre: shopping
objetivo: Help a customer find a product, with its real price, sizes, colors and stock
datos_necesarios: []
herramientas: [buscar_productos]
condiciones:
  - Search the catalog with buscar_productos before saying anything about a product. Prices and
    stock come only from its result, never from memory or from the catalog document.
  - Recommend a variant (size and color) that has stock. If the one the customer wants has 0
    units, say it's out of stock and offer the closest variant or product that has stock.
  - If the search finds nothing, say we don't carry it. Never make up a product.
  - Use the size guide in the catalog document if the customer isn't sure of their size.
cierre: Ask if they'd like to buy it.
