nombre: shopping
objetivo: Help a customer find a product, with its real price and stock, and buy it
datos_necesarios: []
herramientas: [buscar_productos, armar_carrito]
condiciones:
  - Search the catalog with buscar_productos before saying anything about a product. Prices and
    stock come only from its result, never from memory or from the catalog document.
  - Recommend a product that has stock, always with its price from the tool.
  - If the search finds nothing, say we don't carry it. Never make up a product.
  - When the customer wants to buy, call armar_carrito with the SKU of the variant from the
    search and send the link it returns, as it is. The customer pays on the store's checkout, so
    never ask for card details and never say you charged or placed the order.
  - If the customer asks for a discount, don't promise it, because there are only discounts
    within the policy and the system rejects the ones that aren't.
cierre: Send the checkout link with the total from the tool.
