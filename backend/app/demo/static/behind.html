<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>{{title}}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23{{accent}}'/%3E%3Cpath d='M9 11.5A2.5 2.5 0 0 1 11.5 9h9a2.5 2.5 0 0 1 2.5 2.5v6a2.5 2.5 0 0 1-2.5 2.5H15l-4 3v-3.2A2.5 2.5 0 0 1 9 17.5z' fill='white'/%3E%3C/svg%3E">
<script>
  (function () {
    var root = document.documentElement, forced = null, media = matchMedia("(prefers-color-scheme: dark)");
    try { forced = new URLSearchParams(location.search).get("theme"); } catch (e) {}
    function apply() {
      root.setAttribute("data-theme", forced === "dark" || (forced !== "light" && media.matches) ? "dark" : "light");
    }
    apply();
    if (media.addEventListener) media.addEventListener("change", apply);
  })();
</script>
<style>
  /* Vista "detrás de escena" (decisiones 041 y 042): el sitio de la tienda con su widget a la
     izquierda y, a la derecha, el panel en vivo. Los tokens de color son los del widget; la tienda
     suma su paleta (verde bosque, arena y carbón). El tema sigue al sistema y se puede forzar con
     ?theme=light|dark (lo aplica el script del <head> en data-theme). */
  :root {
    color-scheme: light;
    --accent: #{{accent}};
    --bg: #f3f4f6; --ink: #12151a; --muted: #5d6470; --faint: #8b919b;
    --surface: 255,255,255; --line: rgba(18,21,26,.09); --soft: rgba(18,21,26,.05);
    --rim: rgba(255,255,255,.95); --rim-low: rgba(255,255,255,.3);
    --ok: #0f8a4a; --ok-bg: rgba(18,161,80,.1); --no: #b42318; --no-bg: rgba(217,45,32,.09);
    --warn: #8a4a06; --warn-bg: rgba(180,83,9,.1);
    --shadow: 0 1px 2px rgba(15,23,42,.06), 0 14px 30px -14px rgba(15,23,42,.2), 0 50px 110px -30px rgba(15,23,42,.35);
    --site: #f5f1ea; --site-2: #ede7dc; --tile: #ebe4d8; --tile-hover: #e3dbcc;
    --brand: var(--accent); --forest: #1e3a31; --on-forest: #e9eee9;
    --head: rgba(245,241,234,.86); --field: rgba(255,255,255,.72);
    --cta: var(--accent); --on-cta: #fff;
    --foot: var(--site); --foot-ink: var(--ink); --foot-muted: var(--muted);
    --sky-1: #dce4dc; --sky-2: #f3e8d6; --sun: #f6dfbb; --snow: #fbf8f2;
    --r1: #c2cec3; --r2: #9db3a5; --r3: #6e8f7f; --r4: #3e6354; --r5: #24433a;
    --art-shadow: rgba(60,45,25,.13); --metal: #d8d1c2; --leather: #6a4630; --sole: #2a221c;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0c0d10; --ink: #f1f2f4; --muted: #a4aab4; --faint: #7c828c;
    --surface: 23,25,30; --line: rgba(255,255,255,.1); --soft: rgba(255,255,255,.06);
    --rim: rgba(255,255,255,.26); --rim-low: rgba(255,255,255,.05);
    --ok: #4ade80; --ok-bg: rgba(74,222,128,.12); --no: #f87171; --no-bg: rgba(248,113,113,.12);
    --warn: #f5c56b; --warn-bg: rgba(251,191,36,.12);
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 16px 34px -14px rgba(0,0,0,.6), 0 54px 120px -26px rgba(0,0,0,.9);
    --site: #121513; --site-2: #171b19; --tile: #1b201d; --tile-hover: #212723;
    --brand: color-mix(in oklab, var(--accent) 45%, #e8efe9); --forest: #1b3129; --on-forest: #d9e3dc;
    --head: rgba(18,21,19,.84); --field: rgba(255,255,255,.06);
    --cta: #e9e1d2; --on-cta: #14201b;
    --foot: #0b0d0c; --foot-ink: #e3e8e4; --foot-muted: #8d9791;
    --sky-1: #0b1311; --sky-2: #22322c; --sun: #bdb8a8; --snow: #aab8b0;
    --r1: #3a4c44; --r2: #2c3c35; --r3: #213029; --r4: #16221d; --r5: #0e1713;
    --art-shadow: rgba(0,0,0,.4); --metal: #9c968a; --leather: #5d3d2a; --sole: #15110e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(360px, 440px);
  }
  /* -- el sitio de la tienda ------------------------------------------------------------- */
  /* .site no se desplaza: adentro se desplaza .store, y el chat queda fijo encima, abajo a la
     derecha. El contenido deja libre la columna del chat (--chat-lane) y los fondos siguen por
     detrás. */
  .site { position: relative; height: 100vh; height: 100dvh; overflow: hidden; background: var(--site); color: var(--ink);
    --chat-lane: 448px; }
  .store { height: 100%; overflow-x: hidden; overflow-y: auto; container: store / inline-size; scrollbar-width: thin;
    scrollbar-color: color-mix(in srgb, var(--ink) 22%, transparent) transparent; }
  .store a { color: inherit; text-decoration: none; cursor: pointer; }
  .wrap { padding-inline: 40px; }
  @container store (min-width: 900px) { main .wrap, .foot-site .wrap { padding-right: var(--chat-lane); } }
  .kick { display: block; font-size: 11.5px; font-weight: 650; letter-spacing: .16em; text-transform: uppercase; color: var(--brand); }
  .ic { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  .announce { background: var(--forest); color: var(--on-forest); text-align: center; font-size: 12.5px; font-weight: 500;
    letter-spacing: .03em; padding: 9px 16px; }
  .top { position: sticky; top: 0; z-index: 3; background: var(--head); border-bottom: 1px solid var(--line);
    -webkit-backdrop-filter: saturate(1.5) blur(16px); backdrop-filter: saturate(1.5) blur(16px); }
  @media (prefers-reduced-transparency: reduce) { .top { background: color-mix(in srgb, var(--head) 100%, var(--site)); } }
  .bar { display: flex; align-items: center; gap: 12px; height: 68px; padding-inline: 40px; }
  .logo { display: inline-flex; align-items: center; gap: 11px; white-space: nowrap; }
  .logo .mark { width: 28px; height: 28px; color: var(--brand); }
  .logo .initial { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: #fff; display: grid;
    place-items: center; font-weight: 700; font-size: 14px; }
  .logo .word { font-size: 14px; letter-spacing: .17em; text-transform: uppercase; }
  .logo .word b { font-weight: 750; }
  .logo .word span { font-weight: 450; color: var(--muted); }
  .links { display: flex; gap: 26px; margin-left: 40px; margin-right: auto; }
  @container store (max-width: 1100px) { .links { gap: 22px; margin-left: 32px; } .search { width: 176px; } .logo .word { letter-spacing: .14em; } }
  .links a { font-size: 14px; font-weight: 500; opacity: .8; white-space: nowrap; transition: opacity .2s; }
  .links a:hover { opacity: 1; }
  @container store (max-width: 1180px) { .links a:nth-child(5) { display: none; } }
  .search { display: flex; align-items: center; gap: 9px; width: 210px; height: 40px; padding: 0 15px; border-radius: 999px;
    background: var(--field); border: 1px solid var(--line); color: var(--muted); font-size: 13.5px; white-space: nowrap;
    overflow: hidden; }
  .icon { position: relative; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%;
    transition: background .2s; }
  .icon:hover { background: var(--soft); }
  .count { position: absolute; top: 3px; right: 2px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px;
    background: var(--accent); color: #fff; font: 700 10px/17px system-ui, sans-serif; text-align: center;
    box-shadow: 0 0 0 2px var(--site); }

  .hero { position: relative; height: clamp(460px, 66vh, 620px); overflow: hidden; }
  .hero .scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .scene .sky-1 { stop-color: var(--sky-1); } .scene .sky-2 { stop-color: var(--sky-2); }
  .scene .sun { fill: var(--sun); } .scene .snow { fill: var(--snow); }
  .scene .r1 { fill: var(--r1); } .scene .r2 { fill: var(--r2); } .scene .r3 { fill: var(--r3); }
  .scene .r4 { fill: var(--r4); } .scene .r5 { fill: var(--r5); }
  .scene .bird { fill: none; stroke: var(--r3); stroke-width: 2; stroke-linecap: round; }
  .hero .wrap { position: relative; padding-top: clamp(48px, 8.5vh, 92px); }
  .copy { max-width: 600px; }
  .hero h1 { font-size: clamp(40px, 4.9cqi, 72px); line-height: 1.02; letter-spacing: -.035em; font-weight: 750;
    margin: 16px 0 18px; max-width: 10.5em; text-wrap: balance; }
  .hero p { margin: 0; font-size: 16.5px; line-height: 1.55; max-width: 46ch; color: color-mix(in srgb, var(--ink) 74%, transparent); }
  .ctas { display: flex; align-items: center; gap: 26px; margin-top: 30px; }
  .cta { display: inline-flex; align-items: center; gap: 10px; height: 50px; padding: 0 24px; border-radius: 999px;
    background: var(--cta); color: var(--on-cta); font-weight: 600; font-size: 15px; letter-spacing: -.005em; cursor: pointer;
    box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 10px 24px -12px color-mix(in srgb, var(--cta) 70%, transparent);
    transition: transform .25s ease, box-shadow .25s ease; }
  .cta:hover { transform: translateY(-1px); }
  .cta .ic { transition: transform .25s ease; }
  .cta:hover .ic { transform: translateX(3px); }
  .more { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14.5px; cursor: pointer;
    padding-bottom: 2px; border-bottom: 1.5px solid currentColor; }
  .hero.plain { height: auto; padding: 72px 0 84px;
    background: linear-gradient(160deg, color-mix(in oklab, var(--accent) 16%, var(--site)), var(--site)); }

  .shelf { padding: 76px 0 88px; }
  .head-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 30px; }
  .shelf h2 { margin: 8px 0 0; font-size: 32px; line-height: 1.1; letter-spacing: -.028em; font-weight: 720; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(208px, 1fr)); gap: 44px 22px; }
  .product { --p-d: color-mix(in oklab, var(--p) 80%, #0d100e); --p-dd: color-mix(in oklab, var(--p) 58%, #0d100e);
    --p-l: color-mix(in oklab, var(--p) 74%, #fff); cursor: pointer; }
  .tile { position: relative; aspect-ratio: 4 / 5; border-radius: 18px; background: var(--tile); overflow: hidden;
    display: grid; place-items: center; transition: background-color .35s ease; }
  .product:hover .tile { background: var(--tile-hover); }
  .art { width: 92%; height: auto; display: block; transition: transform .55s cubic-bezier(.2,.75,.25,1); }
  .product:hover .art { transform: translateY(-7px) scale(1.04); }
  .badge { position: absolute; z-index: 1; top: 14px; left: 14px; padding: 5px 11px; border-radius: 999px; font-size: 11.5px;
    font-weight: 650; letter-spacing: .02em; background: rgba(var(--surface), .92); color: var(--ink); }
  .badge.new { background: var(--forest); color: var(--on-forest); }
  .line { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 16px; }
  .line h3 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.005em; background: linear-gradient(currentColor 0 0)
    0 100% / 0 1px no-repeat; transition: background-size .35s ease; }
  .product:hover .line h3 { background-size: 100% 1px; }
  .line b { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .line.sub { margin-top: 7px; align-items: center; }
  .shade { color: var(--muted); font-size: 13.5px; }
  .dots { display: flex; gap: 7px; }
  .dot { width: 15px; height: 15px; padding: 0; border: 0; border-radius: 50%; background: var(--s); cursor: pointer;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.22); transition: box-shadow .2s; }
  .dot.on { box-shadow: inset 0 0 0 1px rgba(0,0,0,.22), 0 0 0 2px var(--site), 0 0 0 3.5px color-mix(in srgb, var(--ink) 75%, transparent); }
  :root[data-theme="dark"] .dot { box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); }
  :root[data-theme="dark"] .dot.on { box-shadow: inset 0 0 0 1px rgba(255,255,255,.2), 0 0 0 2px var(--site), 0 0 0 3.5px color-mix(in srgb, var(--ink) 75%, transparent); }
  main section, .foot-site { scroll-margin-top: 69px; }
  .dot:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
  /* las ilustraciones: cada producto pinta sus luces y sombras desde su color (--p) */
  .art .b { fill: var(--p); } .art .d { fill: var(--p-d); } .art .dd { fill: var(--p-dd); } .art .l { fill: var(--p-l); }
  .art .sh { fill: var(--art-shadow); } .art .m { fill: var(--metal); } .art .lea { fill: var(--leather); }
  .art .sole { fill: var(--sole); } .art .o { opacity: .55; } .art .back { filter: brightness(.84); }
  .art .zip, .art .st, .art .stitch, .art .rib, .art .knit, .art .hi, .art .baffle, .art .bind, .art .strap { fill: none; stroke-linecap: round; }
  .art .zip { stroke: var(--p-dd); stroke-width: 3; }
  .art .st { stroke: var(--p-d); stroke-width: 2; }
  .art .stitch { stroke: var(--p-l); stroke-width: 1.6; stroke-dasharray: 5 4; opacity: .7; }
  .art .rib { stroke: var(--p-dd); stroke-dasharray: 1.6 4.4; stroke-linecap: butt; opacity: .45; }
  .art .rib.soft { opacity: .16; }
  .art .knit { stroke: var(--p-d); stroke-width: 1.6; stroke-dasharray: 3 5; opacity: .6; }
  .art .hi { stroke: var(--p-l); stroke-width: 6; opacity: .35; }
  .art .puff { fill: var(--p-l); opacity: .3; }
  .art .baffle { stroke: var(--p-d); stroke-width: 2.4; }
  .art .bind { stroke: var(--p-dd); stroke-width: 5; }
  .art .strap { stroke: var(--leather); stroke-width: 12; }

  .trust { background: var(--site-2); border-block: 1px solid var(--line); padding: 40px 0; }
  .perks { display: grid; grid-template-columns: repeat(auto-fit, minmax(216px, 1fr)); gap: 28px 32px; }
  .perk { display: flex; align-items: flex-start; gap: 14px; }
  .perk .ic { color: var(--brand); margin-top: 1px; }
  .perk b { display: block; font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .perk span { color: var(--muted); font-size: 13.5px; }

  .foot-site { background: var(--foot); color: var(--foot-ink); padding: 64px 0 36px; border-top: 1px solid var(--line); }
  .foot-site .wrap { container-type: inline-size; }
  .cols { display: grid; grid-template-columns: 1.7fr 1fr 1fr 1fr; gap: 36px 28px; }
  @container (max-width: 760px) { .cols { grid-template-columns: repeat(3, 1fr); } .about { grid-column: 1 / -1; } }
  .about .logo .mark { color: var(--brand); }
  .about .logo .word span { color: var(--foot-muted); }
  .about p { margin: 16px 0 0; max-width: 34ch; color: var(--foot-muted); font-size: 14px; line-height: 1.6; }
  .cols h4 { margin: 4px 0 16px; font-size: 11.5px; font-weight: 650; letter-spacing: .16em; text-transform: uppercase; color: var(--foot-muted); }
  .cols a { display: block; font-size: 14px; margin-bottom: 11px; opacity: .88; transition: opacity .2s; }
  .cols a:hover { opacity: 1; }
  .legal { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; margin-top: 52px; padding-top: 22px;
    border-top: 1px solid var(--line); font-size: 12.5px; color: var(--foot-muted); }
  .note { margin: 0; }
  .foot-site:not(:has(.cols)) { padding: 28px 0; }

  /* movimiento reducido: sin desplazamientos; quedan el cambio de fondo y el subrayado */
  @media (prefers-reduced-motion: reduce) {
    .product .art, .cta, .cta .ic { transition: none; }
    .product:hover .art, .cta:hover, .cta:hover .ic { transform: none; }
  }
  .chat { position: absolute; z-index: 4; right: 28px; bottom: 28px; width: 380px; height: min(640px, calc(100dvh - 56px)); }
  /* -- el panel en vivo ------------------------------------------------------------------ */
  .behind { position: relative; height: 100vh; height: 100dvh; display: flex; flex-direction: column;
    background: rgba(var(--surface), .96); border-left: 1px solid var(--line); }
  .behind::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(80% 40% at 50% 0%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%); }
  .head { position: relative; padding: 22px 22px 14px; border-bottom: 1px solid var(--line); }
  .head h2 { margin: 0; font-size: 16.5px; letter-spacing: -.01em; display: flex; align-items: center; gap: 9px; }
  .live { width: 8px; height: 8px; border-radius: 50%; background: #12a150; box-shadow: 0 0 0 0 rgba(18,161,80,.5);
    animation: pulse 1.8s ease-out infinite; }
  @media (prefers-reduced-motion: reduce) { .live { animation: none; } }
  @keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(18,161,80,0); } 100% { box-shadow: 0 0 0 0 rgba(18,161,80,0); } }
  .head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .state { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  .feed { position: relative; flex: 1; overflow: auto; padding: 16px 16px 28px; scrollbar-width: thin; }
  .empty { margin: 40px 18px; text-align: center; color: var(--muted); font-size: 14px; }
  .turn { position: relative; border-radius: 20px; padding: 14px 14px 12px; margin-bottom: 14px;
    background: rgba(var(--surface), .9); border: 1px solid var(--line); box-shadow: var(--shadow); animation: rise .35s ease-out; }
  .turn::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
    background: linear-gradient(180deg, var(--rim), var(--rim-low) 34%, var(--rim-low) 72%, var(--rim));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite: exclude; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .turn { animation: none; } }
  .turn h3 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .09em; color: var(--faint);
    display: flex; justify-content: space-between; font-weight: 600; }
  .row { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; padding: 6px 0; border-top: 1px solid var(--soft); font-size: 13.5px; }
  .row:first-of-type { border-top: 0; }
  .k { color: var(--muted); font-size: 12.5px; padding-top: 2px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px; font-size: 12.5px;
    background: var(--soft); margin: 0 4px 4px 0; white-space: nowrap; }
  .chip.accent { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--ink); }
  .chip.ok { background: var(--ok-bg); color: var(--ok); }
  .chip.no { background: var(--no-bg); color: var(--no); }
  .chip.warn { background: var(--warn-bg); color: var(--warn); }
  .tool { border-radius: 14px; background: var(--soft); padding: 9px 10px; margin-bottom: 8px; }
  .tool b { font-size: 13.5px; }
  .mono { font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--muted); word-break: break-word; }
  .rules { list-style: none; margin: 7px 0 0; padding: 0; }
  .rules li { display: flex; gap: 7px; align-items: baseline; font-size: 12.5px; padding: 1px 0; }
  .rules i { font-style: normal; width: 14px; text-align: center; font-weight: 700; }
  .rules .y i { color: var(--ok); } .rules .n i { color: var(--no); } .rules .s { color: var(--faint); }
  .rules .h i, .rules .h span { color: var(--warn); }
  .alt { font-size: 12.5px; color: var(--muted); margin-top: 5px; }
  .meta { display: flex; gap: 12px; margin-top: 8px; font-size: 12px; color: var(--faint); }
  .meta b { color: var(--muted); font-weight: 600; }
  .meta.timing { flex-wrap: wrap; gap: 3px 12px; margin-top: 4px; }
  .foot { padding: 10px 22px 14px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--faint); }
  @media (max-width: 1100px) {
    body { grid-template-columns: 1fr; height: auto; }
    .site, .behind { height: auto; min-height: 100vh; }
    .site { overflow: visible; }
    .store { height: auto; overflow: visible; }
    .chat { position: relative; right: auto; bottom: auto; margin: 24px 16px; width: auto; height: 600px; }
  }
</style>
</head>
<body>
<section class="site" aria-label="{{name}}">
  <div class="store">{{store}}</div><!-- /store -->
  <div class="chat" id="chat"></div>
</section>
<aside class="behind" id="behind" aria-live="polite">
  <div class="head"><h2><span class="live" aria-hidden="true"></span><span data-t="title"></span></h2>
    <p data-t="subtitle"></p><div class="state" id="state"></div></div>
  <div class="feed" id="feed"><p class="empty" data-t="empty"></p></div>
  <div class="foot" data-t="foot"></div>
</aside>
<script src="/widget.js" data-chat="{{slug}}" data-mode="inline" data-target="#chat" data-lang="{{lang}}"></script>
<script>
(function () {
  "use strict";
  var slug = "{{slug}}", lang = document.documentElement.lang === "en" ? "en" : "es";
  var T = {
    en: {
      title: "Behind the scenes", subtitle: "Live: what the assistant does with each message.",
      empty: "Write in the chat to see each step here.",
      foot: "Read-only. Customer messages and personal data aren't shown: they stay in the chat.",
      message: "Message", intent: "Intent", also: "Also", identity: "Identity", searched: "Searched",
      tools: "Tools", checks: "Checks", cited: "Sources", approval: "Approval", result: "Result",
      verified: "Verified", notVerified: "Not verified", none: "None",
      email_requested: "Asked for the purchase email", code_sent: "Code sent by email",
      code_failed: "The code couldn't be sent", wrong: "Wrong code", locked: "Locked", expired: "Code expired",
      executed: "Ran", approval_required: "Needs approval", denied: "Blocked by the policy guard",
      failed: "The store's system refused it", pending: "Waiting for a person",
      approved: "Approved by a person", rejected: "Rejected or cancelled", emailSent: "Confirmation email sent",
      offered: "Offered instead", upTo: "up to", cancelled: function (n) { return n + " cancelled"; },
      actions: { responder: "Answered", ejecutar: "Acted and answered", pedir_aprobacion: "Asked a person to approve",
        derivar: "Handed off to a person" },
      rejected_check: { grounding_rejected: "Rewrote an answer", format_rejected: "Rewrote an answer",
        tone_rejected: "Asked for empathy first", handoff_rejected: "Reconsidered a handoff" },
      why: "Why", latency: "Latency", cost: "Cost", tokens: "tokens",
      time: { base: "Database", modelo: "Model", espera: "Waiting for Groq", busqueda: "Search", herramientas: "Tools",
        verificaciones: "Checks", email: "Email" },
      queries: function (n) { return n + (n === 1 ? " query" : " queries"); },
      roles: { classifier: "classifier", agent: "agent", model: "model" },
      caseStatus: { open: "Open", waiting_approval: "Waiting for approval", escalated: "With a person", resolved: "Resolved" }
    },
    es: {
      title: "Detrás de escena", subtitle: "En vivo: qué hace el asistente con cada mensaje.",
      empty: "Escribí en el chat para ver acá cada paso.",
      foot: "Solo lectura. Los mensajes y los datos personales del cliente no se muestran: quedan en el chat.",
      message: "Mensaje", intent: "Intención", also: "También", identity: "Identidad", searched: "Buscó",
      tools: "Herramientas", checks: "Controles", cited: "Fuentes", approval: "Aprobación", result: "Resultado",
      verified: "Verificado", notVerified: "Sin verificar", none: "Ninguna",
      email_requested: "Pidió el email de la compra", code_sent: "Envió un código por email",
      code_failed: "No se pudo enviar el código", wrong: "Código incorrecto", locked: "Bloqueado", expired: "Código vencido",
      executed: "Se ejecutó", approval_required: "Necesita aprobación", denied: "La frenó el guardián",
      failed: "El sistema de la empresa la rechazó", pending: "Esperando a una persona",
      approved: "Aprobada por una persona", rejected: "Rechazada o cancelada", emailSent: "Email de confirmación enviado",
      offered: "Ofreció en su lugar", upTo: "hasta", cancelled: function (n) { return n + " cancelada(s)"; },
      actions: { responder: "Respondió", ejecutar: "Actuó y respondió", pedir_aprobacion: "Pidió aprobación a una persona",
        derivar: "Derivó a una persona" },
      rejected_check: { grounding_rejected: "Reescribió una respuesta", format_rejected: "Reescribió una respuesta",
        tone_rejected: "Pidió empatía primero", handoff_rejected: "Reconsideró una derivación" },
      why: "Motivo", latency: "Latencia", cost: "Costo", tokens: "tokens",
      time: { base: "Base de datos", modelo: "Modelo", espera: "Esperando a Groq", busqueda: "Búsqueda",
        herramientas: "Herramientas", verificaciones: "Controles", email: "Email" },
      queries: function (n) { return n + (n === 1 ? " consulta" : " consultas"); },
      roles: { classifier: "clasificador", agent: "agente", model: "modelo" },
      caseStatus: { open: "Abierto", waiting_approval: "Esperando aprobación", escalated: "Con una persona", resolved: "Resuelto" }
    }
  }[lang];
  document.querySelectorAll("[data-t]").forEach(function (n) { n.textContent = T[n.getAttribute("data-t")]; });

  var feed = document.getElementById("feed"), state = document.getElementById("state");
  var last = "";

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function chip(text, kind) { return el("span", "chip" + (kind ? " " + kind : ""), text); }
  function row(label, content) {
    var r = el("div", "row"), v = el("div");
    r.appendChild(el("div", "k", label));
    (Array.isArray(content) ? content : [content]).forEach(function (c) { if (c) v.appendChild(c); });
    r.appendChild(v);
    return r;
  }
  function session() {
    try { return (JSON.parse(localStorage.getItem("edai-chat-" + slug) || "null") || {}).session || null; }
    catch (e) { return null; }
  }
  function params(p) {
    var keys = Object.keys(p || {});
    if (!keys.length) return "";
    return keys.map(function (k) { return k + ": " + (typeof p[k] === "string" ? p[k] : JSON.stringify(p[k])); }).join(" · ");
  }
  function tool(t) {
    var box = el("div", "tool"), head = el("div");
    head.appendChild(el("b", null, t.label + " "));
    var kind = { executed: "ok", approval_required: "warn", denied: "no", failed: "no" }[t.status] || "";
    head.appendChild(chip(t.cancelled != null ? T.cancelled(t.cancelled) : (T[t.status] || t.status), kind));
    box.appendChild(head);
    var p = params(t.params);
    if (p) box.appendChild(el("div", "mono", t.name + " · " + p));
    else box.appendChild(el("div", "mono", t.name));
    var list = el("ul", "rules");
    (t.rules || []).forEach(function (r) {
      var li = el("li", r.hold ? "h" : r.ok === true ? "y" : r.ok === false ? "n" : "s");
      li.appendChild(el("i", null, r.hold ? "!" : r.ok === true ? "✓" : r.ok === false ? "✕" : "·"));
      li.appendChild(el("span", null, r.label));
      list.appendChild(li);
    });
    box.appendChild(list);
    if (t.alternatives && t.alternatives.length) {
      box.appendChild(el("div", "alt", T.offered + ": " + t.alternatives.map(function (a) {
        return a.max != null ? a.tool + " (" + T.upTo + " " + a.max + "%)" : a.tool;
      }).join(" · ")));
    }
    if (t.error) box.appendChild(el("div", "alt", t.error));
    return box;
  }
  function turn(t, i) {
    var card = el("article", "turn");
    var h = el("h3");
    h.appendChild(el("span", null, T.message + " " + (i + 1)));
    var when = t.at ? new Date(t.at) : null;
    h.appendChild(el("span", null, when ? when.toLocaleTimeString(lang, { hour: "2-digit", minute: "2-digit", second: "2-digit" }) : ""));
    card.appendChild(h);
    if (t.intent) {
      var intents = [chip(t.intent.label, "accent")];
      if (t.second_topic) intents.push(chip(T.also + ": " + t.second_topic.label, "accent"));
      card.appendChild(row(T.intent, intents));
    }
    var identity = [chip(t.verified ? T.verified : T.notVerified, t.verified ? "ok" : "")];
    (t.verification || []).forEach(function (v) { if (v.kind !== "verified") identity.push(chip(T[v.kind] || v.kind)); });
    card.appendChild(row(T.identity, identity));
    if (t.searched && t.searched.length) card.appendChild(row(T.searched, t.searched.map(function (s) { return chip(s); })));
    if (t.tools && t.tools.length) card.appendChild(row(T.tools, t.tools.map(tool)));
    if (t.checks && t.checks.length) {
      card.appendChild(row(T.checks, t.checks.map(function (c) {
        var box = el("div", "alt");
        box.appendChild(chip(T.rejected_check[c.kind] || c.kind, "warn"));
        box.appendChild(document.createTextNode(" " + c.reason));
        return box;
      })));
    }
    if (t.sources && t.sources.length) card.appendChild(row(T.cited, t.sources.map(function (s) { return chip(s, "accent"); })));
    if (t.approval) {
      var a = t.approval.status;
      card.appendChild(row(T.approval, [chip(T[a] || a, a === "pending" ? "warn" : a === "approved" ? "ok" : "no"),
        t.approval.email_sent ? chip(T.emailSent, "ok") : null]));
    }
    if (t.action) card.appendChild(row(T.result, chip(T.actions[t.action] || t.action)));
    // Por qué derivó, en una línea y sin datos del cliente (decisión 045).
    if (t.action === "derivar" && t.handoff) card.appendChild(row(T.why, el("span", null, t.handoff)));
    var meta = el("div", "meta");
    if (t.latency_ms) meta.appendChild(el("span", null, T.latency + " " + (t.latency_ms / 1000).toFixed(1) + " s"));
    meta.appendChild(el("span", null, T.cost + " $" + Number(t.cost_usd || 0).toFixed(4)));
    if (t.tokens) meta.appendChild(el("span", null, t.tokens.toLocaleString(lang) + " " + T.tokens));
    card.appendChild(meta);
    if (t.timing) card.appendChild(timing(t.timing));
    return card;
  }
  function secs(ms) { return (ms / 1000).toFixed(1) + " s"; }
  // En qué se fue la latencia (decisión 044): la base y el modelo siempre; el resto si pesa.
  function timing(m) {
    var line = el("div", "meta timing");
    function add(key, extra) {
      var s = el("span");
      s.appendChild(el("b", null, T.time[key]));
      s.appendChild(document.createTextNode(" " + secs(m[key + "_ms"] || 0) + (extra ? " (" + extra + ")" : "")));
      line.appendChild(s);
    }
    add("base", T.queries(m.queries || 0));
    var calls = (m.model_calls || []).map(function (c) {
      return T.roles[c.name] + " " + secs(Math.max(c.ms - c.wait_ms, 0));
    });
    add("modelo", calls.join(" · "));
    ["espera", "busqueda", "herramientas", "verificaciones", "email"].forEach(function (key) {
      if ((m[key + "_ms"] || 0) >= 50) add(key);
    });
    return line;
  }
  function render(data) {
    var key = JSON.stringify(data);
    if (key === last) return;
    last = key;
    var nearBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 80;
    feed.textContent = "";
    state.textContent = "";
    var turns = (data && data.turns) || [];
    if (!turns.length) { feed.appendChild(el("p", "empty", T.empty)); return; }
    if (data.case) {
      var s = data.case.status;
      state.appendChild(chip(T.caseStatus[s] || s, s === "waiting_approval" ? "warn" : s === "escalated" ? "no" : "ok"));
      if (data.case.type) state.appendChild(chip(data.case.type.label, "accent"));
    }
    turns.forEach(function (t, i) { feed.appendChild(turn(t, i)); });
    if (nearBottom || turns.length) feed.scrollTop = feed.scrollHeight;
  }
  var busy = false;
  function tick() {
    var s = session();
    if (!s) { render({ turns: [] }); return; }
    if (busy || document.hidden) return;
    busy = true;
    fetch("{{live}}?session=" + encodeURIComponent(s), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) { if (data) render(data); })
      .catch(function () {})
      .then(function () { busy = false; });
  }
  tick();
  setInterval(tick, 1500);
})();
</script>
<script>
(function () {
  "use strict";
  document.querySelectorAll(".product .dot").forEach(function (dot) {
    dot.addEventListener("click", function (event) {
      event.stopPropagation();
      var card = dot.closest(".product");
      card.style.setProperty("--p", dot.style.getPropertyValue("--s"));
      card.setAttribute("data-color", dot.getAttribute("aria-label"));
      card.querySelector(".shade").textContent = dot.getAttribute("aria-label");
      card.querySelectorAll(".dot").forEach(function (other) {
        other.classList.toggle("on", other === dot);
        other.setAttribute("aria-pressed", other === dot ? "true" : "false");
      });
    });
  });
})();
</script>
</body>
</html>
